<stop offset="0" stop-color="#2563EB"/>
<stop offset="0.65" stop-color="#2563EB"/>
<stop offset="1" stop-color="#06B6D4"/>
</linearGradient>
</defs>
<path d="M50,198 L86,198 L118,72 L150,198 L187,53" fill="none" stroke="url(#pg)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="162,77 187,53 197,85" fill="none" stroke="#06B6D4" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="68" cy="198" r="12" fill="#06B6D4"/>
</svg>
