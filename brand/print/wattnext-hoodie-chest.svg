<svg width="256" height="256" viewBox="0 0 256 256" role="img" xmlns="http://www.w3.org/2000/svg">
<title>WattNext hoodie left-chest print</title>
<desc>Full-color WattNext compact mark on transparent background, for the left chest of an ink/dark garment. Print via DTG/DTF at ~9 cm wide. Glow omitted for clean small-size print.</desc>
<defs>
