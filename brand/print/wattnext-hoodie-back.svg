<svg width="680" height="400" viewBox="0 0 680 400" role="img" xmlns="http://www.w3.org/2000/svg">
<title>WattNext hoodie back print</title>
<desc>Full-color WattNext pulse lockup on transparent background, for the back of an ink/dark garment. White "Watt", bright-cyan "Next", sky tagline. Print via DTG/DTF at ~28 cm wide.</desc>
<defs>
<linearGradient id="pg" gradientUnits="userSpaceOnUse" x1="155" y1="285" x2="521" y2="54">
<stop offset="0" stop-color="#2563EB"/>
<stop offset="0.45" stop-color="#2563EB"/>
<stop offset="0.72" stop-color="#06B6D4"/>
<stop offset="1" stop-color="#22D3EE"/>
</linearGradient>
<filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
<feGaussianBlur stdDeviation="3.5" result="b"/>
<feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
</defs>
<g filter="url(#glow)">
<path d="M155,285 L245,285 L265,110 L305,250 L345,150 L385,250 L425,110 L465,250 L521,54" fill="none" stroke="url(#pg)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="498,76 521,54 529,85" fill="none" stroke="#22D3EE" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="223" cy="285" r="8.5" fill="#2563EB"/>
</g>
<text x="340" y="344" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700"><tspan fill="#FFFFFF">Watt</tspan><tspan fill="#22D3EE">Next</tspan></text>
<text x="342" y="370" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" letter-spacing="4" fill="#38BDF8">DETECT · DECIDE · DELIVER</text>
</svg>
